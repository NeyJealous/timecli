name: PortCore validation

on:
  push:
    branches: [main]
    paths:
      - "src/PortCore/**"
      - "tests/PortCore.Smoke/**"
      - "tests/PortCore.TimelineScenario/**"
      - "tests/PortCore.HeroCombatScenario/**"
      - "tests/UnityAdapter.Compile/**"
      - "unity/TimeCli/**"
      - ".github/workflows/portcore-smoke.yml"
  pull_request:
    paths:
      - "src/PortCore/**"
      - "tests/PortCore.Smoke/**"
      - "tests/PortCore.TimelineScenario/**"
      - "tests/PortCore.HeroCombatScenario/**"
      - "tests/UnityAdapter.Compile/**"
      - "unity/TimeCli/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project tests/PortCore.Smoke/PortCore.Smoke.csproj --configuration Release

  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project tests/PortCore.TimelineScenario/PortCore.TimelineScenario.csproj --configuration Release

  hero-combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project tests/PortCore.HeroCombatScenario/PortCore.HeroCombatScenario.csproj --configuration Release

  unity-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build src/PortCore/PortCore.csproj -f netstandard2.1 --configuration Release

  unity-adapter-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project tests/UnityAdapter.Compile/UnityAdapter.Compile.csproj --configuration Release
