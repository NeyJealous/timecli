name: PortCore smoke

on:
  push:
    branches: [main]
    paths:
      - "src/PortCore/**"
      - "tests/PortCore.Smoke/**"
      - ".github/workflows/portcore-smoke.yml"
  pull_request:
    paths:
      - "src/PortCore/**"
      - "tests/PortCore.Smoke/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project tests/PortCore.Smoke/PortCore.Smoke.csproj --configuration Release
