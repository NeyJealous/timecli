name: PortCore validation

on:
  push:
    branches: [main]
    paths:
      - "src/PortCore/**"
      - "tests/PortCore.Smoke/**"
      - "tests/PortCore.TimelineScenario/**"
      - "tests/PortCore.HeroCombatScenario/**"
      - ".github/workflows/portcore-smoke.yml"
  pull_request:
    paths:
      - "src/PortCore/**"
      - "tests/PortCore.Smoke/**"
      - "tests/PortCore.TimelineScenario/**"
      - "tests/PortCore.HeroCombatScenario/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project tests/PortCore.Smoke/PortCore.Smoke.csproj --configuration Release

  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project tests/PortCore.TimelineScenario/PortCore.TimelineScenario.csproj --configuration Release

  hero-combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project tests/PortCore.HeroCombatScenario/PortCore.HeroCombatScenario.csproj --configuration Release
